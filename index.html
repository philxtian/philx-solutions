<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHILX Solutions | Enterprise IT & Software Solutions</title>
    <meta name="description" content="PHILX Solutions provides high-performance Website Design, Web Development, Mobile Applications, Enterprise Software, and Microsoft 365 & Cloud Email Solutions.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563EB',
                            dark: '#0F172A',
                            surface: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <!-- Sticky Navigation Bar -->
    <div id="navbar-container" hx-get="partials/navbar.html" hx-trigger="load" hx-swap="outerHTML">
        <div class="h-16 flex items-center justify-center text-slate-400 text-sm">Loading navigation...</div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <div id="hero-container" hx-get="partials/hero.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-400 text-sm">Loading hero...</div>
        </div>

        <!-- Services Grid -->
        <div id="services-container" hx-get="partials/services.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-16 text-center text-slate-400 text-sm">Loading services...</div>
        </div>

        <!-- Contact Section -->
        <div id="contact-container" hx-get="partials/contact.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-16 text-center text-slate-400 text-sm">Loading contact form...</div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container" hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML">
        <div class="py-8 text-center text-slate-400 text-sm">Loading footer...</div>
    </div>

    <!-- WordPress REST API & HTMX Helper Script -->
    <script src="js/wp-api.js"></script>
</body>
</html>
