<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHILX Solutions | Enterprise IT & Software Solutions</title>
    <meta name="description" content="PHILX Solutions delivers enterprise website design, full-stack development, mobile apps, and cloud software powered by Headless WordPress, HTMX, and modern engineering.">
    <!-- Inline Theme Initializer script -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        white: '#FFFFFF',
                        charcoal: '#0A0A0C'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
        }

        /* Tech Dot Grid Background Pattern */
        .bg-tech-grid {
            background-size: 32px 32px;
            background-image: radial-gradient(circle, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
        }
        .dark .bg-tech-grid {
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        }

        /* Glass Panel Helper */
        .glass-panel {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="bg-white dark:bg-black text-slate-900 dark:text-white min-h-screen flex flex-col antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black transition-colors duration-300 relative bg-tech-grid overflow-x-hidden">

    <!-- Highly Diffused Soft Atmospheric Aurora Aura Background Patches -->
    <div class="fixed top-[-10%] left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-gradient-to-b from-slate-200/40 via-zinc-300/15 to-transparent dark:from-zinc-800/20 dark:via-zinc-900/10 dark:to-transparent rounded-full blur-[160px] pointer-events-none z-0 transition-opacity duration-500"></div>
    <div class="fixed top-[30%] right-[-5%] w-[750px] h-[750px] bg-gradient-to-tr from-indigo-200/20 via-slate-200/30 to-transparent dark:from-indigo-900/10 dark:via-zinc-800/15 dark:to-transparent rounded-full blur-[180px] pointer-events-none z-0 transition-opacity duration-500"></div>
    <div class="fixed bottom-[5%] left-[-5%] w-[800px] h-[800px] bg-gradient-to-tr from-slate-300/30 via-zinc-200/20 to-transparent dark:from-zinc-800/15 dark:via-zinc-900/10 dark:to-transparent rounded-full blur-[180px] pointer-events-none z-0 transition-opacity duration-500"></div>

    <!-- Sticky Pill Navigation Bar -->
    <div id="navbar-container" hx-get="partials/navbar.html" hx-trigger="load" hx-swap="outerHTML" class="z-50 relative">
        <div class="h-20 flex items-center justify-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading navigation...</div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow z-10 relative">
        <!-- Hero Section -->
        <div id="hero-container" hx-get="partials/hero.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-24 text-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading hero section...</div>
        </div>

        <!-- Services Grid -->
        <div id="services-container" hx-get="partials/services.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading services...</div>
        </div>

        <!-- About Section -->
        <div id="about-container" hx-get="partials/about.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading about section...</div>
        </div>

        <!-- Expertise Section -->
        <div id="expertise-container" hx-get="partials/expertise.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading expertise section...</div>
        </div>

        <!-- Contact Section -->
        <div id="contact-container" hx-get="partials/contact.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading contact section...</div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container" hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML" class="z-10 relative">
        <div class="py-8 text-center text-slate-400 dark:text-zinc-500 text-xs tracking-widest uppercase">Loading footer...</div>
    </div>

    <!-- WordPress REST API & HTMX Helper Script -->
    <script src="js/wp-api.js"></script>
</body>
</html>
