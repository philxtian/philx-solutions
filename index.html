<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHILX Solutions | Enterprise IT & Software Solutions</title>
    <meta name="description" content="PHILX Solutions delivers enterprise website design, full-stack development, mobile apps, and cloud software powered by Headless WordPress, HTMX, and modern engineering.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: {
                            DEFAULT: '#0A0A0C',
                            surface: '#121216',
                            card: '#16161C',
                            border: 'rgba(255, 255, 255, 0.08)'
                        },
                        brand: {
                            blue: '#2563EB',
                            indigo: '#4F46E5',
                            glow: 'rgba(37, 99, 235, 0.25)'
                        }
                    },
                    fontFamily: {
                        sans: ['SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'Inter', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        .glow-radial {
            background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18) 0%, rgba(10, 10, 12, 0) 70%);
        }
        
        .glow-card {
            box-shadow: 0 0 40px -15px rgba(37, 99, 235, 0.2);
        }

        .border-glow {
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .border-glow:hover {
            border-color: rgba(37, 99, 235, 0.5);
            box-shadow: 0 0 30px -5px rgba(37, 99, 235, 0.3);
        }

        .text-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-blue {
            background: linear-gradient(135deg, #60A5FA 0%, #2563EB 50%, #1D4ED8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#0A0A0C] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white relative overflow-x-hidden">

    <!-- Ambient Background Glows -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] glow-radial pointer-events-none z-0"></div>

    <!-- Sticky Pill Navigation Bar -->
    <div id="navbar-container" hx-get="partials/navbar.html" hx-trigger="load" hx-swap="outerHTML">
        <div class="h-20 flex items-center justify-center text-slate-500 text-xs tracking-wider uppercase">Loading navigation...</div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow z-10 relative">
        <!-- Hero Section -->
        <div id="hero-container" hx-get="partials/hero.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-24 text-center text-slate-500 text-xs tracking-wider uppercase">Loading hero section...</div>
        </div>

        <!-- Services Grid -->
        <div id="services-container" hx-get="partials/services.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-500 text-xs tracking-wider uppercase">Loading services...</div>
        </div>

        <!-- Contact Section -->
        <div id="contact-container" hx-get="partials/contact.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-slate-500 text-xs tracking-wider uppercase">Loading contact section...</div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container" hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML">
        <div class="py-8 text-center text-slate-500 text-xs tracking-wider uppercase">Loading footer...</div>
    </div>

    <!-- WordPress REST API & HTMX Helper Script -->
    <script src="js/wp-api.js"></script>
</body>
</html>
