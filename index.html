<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHILX Solutions | Enterprise IT & Software Solutions</title>
    <meta name="description" content="PHILX Solutions delivers enterprise website design, full-stack development, mobile apps, and cloud software powered by Headless WordPress, HTMX, and modern engineering.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        white: '#FFFFFF',
                        zinc: {
                            900: '#121212',
                            800: '#1E1E1E',
                            700: '#2A2A2A',
                            400: '#A1A1AA'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #000000;
            color: #FFFFFF;
        }

        .border-monochrome {
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease-in-out;
        }
        .border-monochrome:hover {
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col antialiased selection:bg-white selection:text-black">

    <!-- Sticky Pill Navigation Bar -->
    <div id="navbar-container" hx-get="partials/navbar.html" hx-trigger="load" hx-swap="outerHTML">
        <div class="h-20 flex items-center justify-center text-zinc-500 text-xs tracking-widest uppercase">Loading navigation...</div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow z-10 relative">
        <!-- Hero Section -->
        <div id="hero-container" hx-get="partials/hero.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-24 text-center text-zinc-500 text-xs tracking-widest uppercase">Loading hero section...</div>
        </div>

        <!-- Services Grid -->
        <div id="services-container" hx-get="partials/services.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-zinc-500 text-xs tracking-widest uppercase">Loading services...</div>
        </div>

        <!-- Contact Section -->
        <div id="contact-container" hx-get="partials/contact.html" hx-trigger="load" hx-swap="outerHTML">
            <div class="py-20 text-center text-zinc-500 text-xs tracking-widest uppercase">Loading contact section...</div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container" hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML">
        <div class="py-8 text-center text-zinc-500 text-xs tracking-widest uppercase">Loading footer...</div>
    </div>

    <!-- WordPress REST API & HTMX Helper Script -->
    <script src="js/wp-api.js"></script>
</body>
</html>
