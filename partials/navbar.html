<header id="navbar-container" class="sticky top-4 z-50 w-full max-w-6xl mx-auto px-4 sm:px-6">
    <div class="w-full backdrop-blur-xl bg-black/90 border border-white/15 rounded-full px-6 h-16 flex items-center justify-between shadow-2xl transition-all duration-300 relative z-50">
        <!-- Brand Logo & Name -->
        <a href="#" class="flex items-center space-x-3 group relative z-20">
            <img src="assets/logo-mark-white.png" alt="PHILX Solutions Logo" class="h-9 w-auto rounded-lg group-hover:scale-105 transition-transform duration-300">
            <div class="flex flex-col justify-center w-[72px]">
                <div class="flex justify-between font-black text-white leading-none text-[13px] uppercase">
                    <span>P</span><span>H</span><span>I</span><span>L</span><span>X</span>
                </div>
                <div class="flex justify-between text-[9px] font-bold text-zinc-400 leading-none mt-1 uppercase">
                    <span>S</span><span>O</span><span>L</span><span>U</span><span>T</span><span>I</span><span>O</span><span>N</span><span>S</span>
                </div>
            </div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center space-x-8 text-xs font-semibold text-zinc-300 tracking-wider uppercase relative z-20">
            <a href="#hero" class="relative py-1 hover:text-white transition-colors group">
                Home
                <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-white transition-all duration-300 ease-out group-hover:w-full"></span>
            </a>
            <a href="#services" class="relative py-1 hover:text-white transition-colors group">
                Services
                <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-white transition-all duration-300 ease-out group-hover:w-full"></span>
            </a>
            <a href="#about" class="relative py-1 hover:text-white transition-colors group">
                About
                <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-white transition-all duration-300 ease-out group-hover:w-full"></span>
            </a>
            <a href="#expertise" class="relative py-1 hover:text-white transition-colors group">
                Expertise
                <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-white transition-all duration-300 ease-out group-hover:w-full"></span>
            </a>
            <a href="#contact" class="relative py-1 hover:text-white transition-colors group">
                Contact
                <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-white transition-all duration-300 ease-out group-hover:w-full"></span>
            </a>
        </nav>

        <!-- CTA & Mobile Menu Button -->
        <div class="flex items-center space-x-3 relative z-20">
            <!-- Mobile Hamburger Toggle Button -->
            <button id="mobile-menu-btn" type="button" onclick="toggleMobileMenu()" aria-label="Toggle Navigation Menu"
                    class="md:hidden p-2 rounded-full border border-white/20 bg-zinc-900 text-zinc-200 hover:bg-zinc-800 transition-colors backdrop-blur-md relative z-30 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- CTA Button -->
            <a href="#contact" class="hidden sm:inline-flex items-center justify-center px-5 py-2 text-xs font-bold text-black bg-white hover:bg-zinc-200 rounded-full border border-white transition-all shadow-md relative z-30 cursor-pointer uppercase tracking-widest">
                Get a Quote
            </a>
        </div>
    </div>

    <!-- Mobile Dropdown Menu Drawer -->
    <div id="mobile-menu" class="hidden md:hidden mt-3 w-full bg-black/95 border border-white/15 rounded-2xl p-6 backdrop-blur-2xl shadow-2xl space-y-4 text-sm font-semibold text-zinc-200 uppercase tracking-wider relative z-40 transition-all duration-300">
        <a href="#hero" class="block py-2 hover:text-white border-b border-white/10">Home</a>
        <a href="#services" class="block py-2 hover:text-white border-b border-white/10">Services</a>
        <a href="#about" class="block py-2 hover:text-white border-b border-white/10">About</a>
        <a href="#expertise" class="block py-2 hover:text-white border-b border-white/10">Expertise</a>
        <a href="#contact" class="block py-2 hover:text-white border-b border-white/10">Contact</a>
        <a href="#contact" class="block w-full text-center py-3 px-4 mt-2 text-xs font-bold text-black bg-white rounded-full uppercase tracking-widest">Get a Quote &rarr;</a>
    </div>
</header>
