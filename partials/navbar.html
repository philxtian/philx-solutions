<header id="navbar-container" class="sticky top-4 z-50 w-full max-w-6xl mx-auto px-4 sm:px-6">
    <div class="w-full backdrop-blur-xl bg-white/70 dark:bg-black/60 border border-black/10 dark:border-white/15 rounded-full px-6 h-16 flex items-center justify-between shadow-xl shadow-black/5 dark:shadow-none transition-all duration-300">
        <!-- Brand Monogram & Name -->
        <a href="#" class="flex items-center space-x-3 group">
            <div class="w-9 h-9 rounded-full bg-black text-white dark:bg-white dark:text-black flex items-center justify-center font-extrabold text-sm group-hover:scale-105 transition-transform">
                PX
            </div>
            <div class="flex flex-col">
                <span class="font-extrabold text-slate-900 dark:text-white tracking-tight leading-none text-base">PHILX</span>
                <span class="text-[9px] font-bold text-slate-900 dark:text-white tracking-[0.25em] uppercase leading-none mt-1">SOLUTIONS</span>
            </div>
        </a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center space-x-8 text-xs font-semibold text-slate-600 dark:text-zinc-300 tracking-wider uppercase">
            <a href="#hero" class="hover:text-black dark:hover:text-white transition-colors">Home</a>
            <a href="#services" class="hover:text-black dark:hover:text-white transition-colors">Services</a>
            <a href="#about" class="hover:text-black dark:hover:text-white transition-colors">About</a>
            <a href="#expertise" class="hover:text-black dark:hover:text-white transition-colors">Expertise</a>
            <a href="#contact" class="hover:text-black dark:hover:text-white transition-colors">Contact</a>
        </nav>

        <!-- CTA & Dark/Light Mode Toggle Switch -->
        <div class="flex items-center space-x-3">
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle Theme"
                    class="p-2 rounded-full border border-black/10 dark:border-white/20 bg-white/80 dark:bg-zinc-900/80 text-slate-800 dark:text-zinc-200 hover:bg-slate-200 dark:hover:bg-zinc-800 transition-colors backdrop-blur-md">
                <!-- Sun Icon (visible in Dark Mode) -->
                <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
                <!-- Moon Icon (visible in Light Mode) -->
                <svg id="theme-toggle-dark-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>

            <!-- CTA Button -->
            <a href="#contact" class="inline-flex items-center justify-center px-5 py-2 text-xs font-bold text-white bg-black hover:bg-slate-800 dark:text-black dark:bg-white dark:hover:bg-zinc-200 rounded-full border border-black dark:border-white transition-all shadow-md">
                Get a Quote
            </a>
        </div>
    </div>
</header>
