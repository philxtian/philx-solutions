<section id="contact" data-section-theme="dark" class="relative min-h-screen flex flex-col justify-center py-28 bg-black text-white border-b border-white/10 transition-colors duration-300 overflow-hidden">
    <!-- Section-Scoped Ambient Gradient (Randomized Multi-Blob Constellation) -->
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- Blob 1: Cyan/Sky Upper Right Arch -->
        <div class="absolute top-[-18%] right-[15%] w-[920px] h-[560px] transform-gpu">
            <div class="blob-slow w-full h-full will-change-transform" data-speed="0.038" data-weight="0.9">
                <div class="w-full h-full bg-gradient-to-b from-cyan-400/40 via-sky-500/30 to-transparent rounded-full blur-[150px] animate-morph-slow transform-gpu will-change-transform"></div>
            </div>
        </div>
        <!-- Blob 2: Teal/Emerald Deep Lower Left -->
        <div class="absolute bottom-[-15%] left-[-10%] w-[670px] h-[670px] transform-gpu">
            <div class="blob-medium w-full h-full will-change-transform" data-speed="0.075" data-weight="-1.3">
                <div class="w-full h-full bg-gradient-to-tr from-teal-400/35 via-emerald-500/30 to-transparent rounded-full blur-[140px] animate-morph-slow transform-gpu will-change-transform" style="animation-direction: reverse;"></div>
            </div>
        </div>
        <!-- Blob 3: Emerald/Sky Mid Left Spark -->
        <div class="absolute top-[30%] left-[12%] w-[480px] h-[480px] transform-gpu">
            <div class="blob-fast w-full h-full will-change-transform" data-speed="0.125" data-weight="1.6" style="animation-duration: 10s;">
                <div class="w-full h-full bg-gradient-to-r from-emerald-400/35 via-sky-400/25 to-transparent rounded-full blur-[108px] animate-morph-fast transform-gpu will-change-transform"></div>
            </div>
        </div>
        <!-- Blob 4: Deep Blue/Teal Right Base -->
        <div class="absolute bottom-[10%] right-[-8%] w-[540px] h-[420px] transform-gpu">
            <div class="blob-slow w-full h-full will-change-transform" data-speed="0.048" data-weight="-0.95" style="animation-duration: 12s;">
                <div class="w-full h-full bg-gradient-to-br from-blue-600/30 via-teal-400/25 to-transparent rounded-full blur-[130px] animate-morph-slow transform-gpu will-change-transform"></div>
            </div>
        </div>
        <!-- Blob 5: Sky Blue/Cyan Central Core -->
        <div class="absolute top-[62%] right-[28%] w-[370px] h-[370px] transform-gpu">
            <div class="blob-fast w-full h-full will-change-transform" data-speed="0.14" data-weight="-1.7" style="animation-duration: 8.5s;">
                <div class="w-full h-full bg-gradient-to-tl from-sky-400/35 via-cyan-500/30 to-transparent rounded-full blur-[100px] animate-morph-fast transform-gpu will-change-transform"></div>
            </div>
        </div>
    </div>

    <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16 reveal-hidden">
            <h2 class="text-xs font-bold uppercase tracking-[0.3em] text-zinc-400 mb-3">Get In Touch</h2>
            <p class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight uppercase">Initiate Consultation</p>
            <p class="mt-4 text-zinc-400 text-base max-w-xl mx-auto">Fill out your project scope or copy our direct engineering inbox.</p>
            
            <!-- One-Click Copy Email Chip -->
            <div class="mt-6 inline-flex items-center justify-center">
                <button type="button" onclick="copyToClipboard('hello@philxsolutions.com', this)" 
                        class="inline-flex items-center space-x-2.5 px-5 py-2.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white shadow-lg hover:bg-white/20 transition-all duration-300 cursor-pointer group">
                    <svg class="w-4 h-4 text-zinc-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span class="copy-label">hello@philxsolutions.com</span>
                </button>
            </div>
        </div>

        <div class="group relative no-tilt reveal-hidden delay-200">
            <div class="bg-white/[0.05] backdrop-blur-3xl border border-white/[0.1] shadow-[0_8px_32px_0_rgba(0,0,0,0.36)] rounded-3xl overflow-hidden p-8 sm:p-12 relative z-10 transition-all duration-500 ease-out hover:bg-white/[0.08] hover:border-white/30">
                <div class="card-spotlight absolute inset-0 pointer-events-none z-0"></div>
                <form id="contact-form" class="space-y-6">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- Full Name -->
                        <div>
                            <label for="name" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Your Name</label>
                            <input type="text" id="name" name="name" required placeholder="Alexander Wright"
                                   class="w-full px-4 py-3 bg-black border border-white/15 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-white text-sm transition-colors">
                        </div>

                        <!-- Email Address -->
                        <div>
                            <label for="email" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Corporate Email</label>
                            <input type="email" id="email" name="email" required placeholder="alex@company.com"
                                   class="w-full px-4 py-3 bg-black border border-white/15 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-white text-sm transition-colors">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- Company / Organization -->
                        <div>
                            <label for="company" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Company / Organization</label>
                            <input type="text" id="company" name="company" placeholder="Nexus Enterprise Corp"
                                   class="w-full px-4 py-3 bg-black border border-white/15 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-white text-sm transition-colors">
                        </div>

                        <!-- Interest / Solution -->
                        <div>
                            <label for="solution" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Solution Area</label>
                            <select id="solution" name="solution"
                                    class="w-full px-4 py-3 bg-black border border-white/15 rounded-xl text-white focus:outline-none focus:border-white text-sm transition-colors">
                                <option value="erp">Enterprise ERP & POS Architecture</option>
                                <option value="web-api">Full-Stack Web & REST API Engineering</option>
                                <option value="cloud">Cloud Infrastructure & Migration</option>
                                <option value="itsm">ITSM & ITIL Service Governance</option>
                                <option value="other">General Engineering Inquiry</option>
                            </select>
                        </div>
                    </div>

                    <!-- Message Body -->
                    <div>
                        <label for="message" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Project Overview</label>
                        <textarea id="message" name="message" rows="4" required placeholder="Describe your technical requirements or system architecture goals..."
                                  class="w-full px-4 py-3 bg-black border border-white/15 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-white text-sm transition-colors resize-none"></textarea>
                    </div>

                    <!-- Cloudflare Turnstile Widget Wrapper -->
                    <div class="w-full flex justify-center items-center mb-6 min-h-[65px] rounded-xl border border-white/5 bg-black/50">
                        <div id="cf-turnstile-widget" style="max-width: 100%; width: 100%;" class="flex justify-center"></div>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button type="submit" id="contact-submit-btn"
                                class="w-full sm:w-auto inline-flex items-center justify-center px-10 py-4 text-xs font-bold text-white bg-white/10 backdrop-blur-md border border-white/20 shadow-lg hover:bg-white/20 transition-all duration-300 rounded-xl uppercase tracking-widest text-center cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg id="contact-btn-spinner" class="animate-spin -ml-1 mr-3 h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="contact-btn-text">Submit Consultation Request &rarr;</span>
                        </button>
                    </div>
                </form>

                <!-- Dynamic Form Response Target Container -->
                <div id="form-response" class="mt-6"></div>

                <script>
                    // Render Turnstile explicitly because of HTMX dynamic injection
                    function renderTurnstile() {
                        if (typeof turnstile !== 'undefined') {
                            const widgetContainer = document.getElementById('cf-turnstile-widget');
                            // Ensure it hasn't been rendered yet to prevent duplicate widgets
                            if (widgetContainer && widgetContainer.innerHTML.trim() === '') {
                                turnstile.render('#cf-turnstile-widget', {
                                    sitekey: '0x4AAAAAAELif50Z16CKUluC',
                                    theme: 'dark',
                                    size: 'flexible'
                                });
                            }
                        }
                    }

                    function showTurnstileLoadError() {
                        if (typeof turnstile !== 'undefined') return; // it loaded after all, race-safe no-op
                        const responseContainer = document.getElementById('form-response');
                        const submitBtn = document.getElementById('contact-submit-btn');
                        if (responseContainer && !responseContainer.dataset.turnstileErrorShown) {
                            responseContainer.dataset.turnstileErrorShown = 'true';
                            responseContainer.innerHTML = '<div class="text-amber-400 text-sm font-medium p-4 bg-amber-400/10 rounded-xl border border-amber-400/20 flex items-center space-x-3"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg><span>Security check failed to load. Please disable ad-blockers or content-blocking extensions and refresh the page.</span></div>';
                        }
                        if (submitBtn) submitBtn.disabled = true;
                    }

                    // React immediately if the Turnstile script tag's onerror already fired
                    window.addEventListener('turnstile-load-error', showTurnstileLoadError);
                    if (window.__turnstileLoadFailed) showTurnstileLoadError();

                    // Attempt immediate render, or wait for script to load
                    if (typeof turnstile !== 'undefined') {
                        renderTurnstile();
                    } else {
                        // Polling fallback if Turnstile script is still loading
                        let attempts = 0;
                        const turnstileInterval = setInterval(() => {
                            if (typeof turnstile !== 'undefined') {
                                clearInterval(turnstileInterval);
                                renderTurnstile();
                            }
                            attempts++;
                            if (attempts > 50) {
                                clearInterval(turnstileInterval); // Timeout after 5 seconds
                                showTurnstileLoadError();
                            }
                        }, 100);
                    }

                    document.getElementById('contact-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const form = e.target;
                        const formData = new FormData(form);
                        const data = Object.fromEntries(formData.entries());
                        const responseContainer = document.getElementById('form-response');
                        const submitBtn = document.getElementById('contact-submit-btn');
                        const btnSpinner = document.getElementById('contact-btn-spinner');
                        const btnText = document.getElementById('contact-btn-text');
                        
                        // Ensure Turnstile token exists
                        if (!data['cf-turnstile-response']) {
                            responseContainer.innerHTML = '<div class="text-amber-400 text-sm font-medium p-4 bg-amber-400/10 rounded-xl border border-amber-400/20 flex items-center space-x-3"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg><span>Please complete the security check.</span></div>';
                            return;
                        }

                        // Loading State
                        submitBtn.disabled = true;
                        btnSpinner.classList.remove('hidden');
                        btnText.textContent = 'Submitting...';
                        responseContainer.innerHTML = '';

                        // Send to your backend API
                        try {
                            const res = await fetch('/api/contact', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            });
                            
                            const resultData = await res.json().catch(() => ({}));
                            
                            if (res.ok) {
                                responseContainer.innerHTML = '<div class="text-emerald-400 text-sm font-medium p-4 bg-emerald-400/10 rounded-xl border border-emerald-400/20 flex items-center space-x-3"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Thank you! Your request has been securely sent.</span></div>';
                                form.reset();
                                if (typeof turnstile !== 'undefined') turnstile.reset();
                            } else {
                                const errMsg = resultData.error || 'Error submitting the form. Bot detected or server issue.';
                                responseContainer.innerHTML = `<div class="text-red-400 text-sm font-medium p-4 bg-red-400/10 rounded-xl border border-red-400/20 flex items-center space-x-3"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>${errMsg}</span></div>`;
                                if (typeof turnstile !== 'undefined') turnstile.reset();
                            }
                        } catch (err) {
                            responseContainer.innerHTML = '<div class="text-red-400 text-sm font-medium p-4 bg-red-400/10 rounded-xl border border-red-400/20 flex items-center space-x-3"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Network error. Please try again later.</span></div>';
                            if (typeof turnstile !== 'undefined') turnstile.reset();
                        } finally {
                            // Reset Loading State
                            submitBtn.disabled = false;
                            btnSpinner.classList.add('hidden');
                            btnText.innerHTML = 'Submit Consultation Request &rarr;';
                        }
                    });
                </script>
            </div>
        </div>
    </div>
</section>
