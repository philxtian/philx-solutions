<section id="contact" data-section-theme="dark" class="py-28 bg-black/75 backdrop-blur-md text-white border-b border-white/10 transition-colors duration-300">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-xs font-bold uppercase tracking-[0.3em] text-zinc-400 mb-3">Get In Touch</h2>
            <p class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight uppercase">Initiate Consultation</p>
            <p class="mt-4 text-zinc-400 text-base max-w-xl mx-auto">Fill out your project scope or copy our direct engineering inbox.</p>
            
            <!-- One-Click Copy Email Chip -->
            <div class="mt-6 inline-flex items-center justify-center">
                <button type="button" onclick="copyToClipboard('hello@philxsolutions.com', this)" 
                        class="inline-flex items-center space-x-2.5 px-5 py-2.5 rounded-full bg-zinc-900 border border-white/20 text-zinc-200 text-xs font-semibold hover:border-white hover:text-white transition-all cursor-pointer group shadow-sm">
                    <svg class="w-4 h-4 text-zinc-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span class="copy-label">hello@philxsolutions.com</span>
                </button>
            </div>
        </div>

        <div class="group relative">
            <div class="bg-zinc-950 border border-white/15 rounded-3xl p-8 sm:p-12 shadow-2xl relative z-10">
                <form id="contact-form" 
                      hx-post="api/contact-success.html" 
                      hx-target="#form-response" 
                      hx-swap="innerHTML"
                      onsubmit="window.PHILX_WP_API && window.PHILX_WP_API.handleContactSubmit(event)"
                      class="space-y-6">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Full Name *</label>
                            <input type="text" id="name" name="name" required placeholder="John Doe" 
                                   class="w-full px-4 py-3.5 rounded-xl border border-white/20 bg-zinc-900 text-white placeholder-zinc-500 focus:border-white focus:ring-1 focus:ring-white outline-none transition-colors">
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Business Email *</label>
                            <input type="email" id="email" name="email" required placeholder="john@company.com" 
                                   class="w-full px-4 py-3.5 rounded-xl border border-white/20 bg-zinc-900 text-white placeholder-zinc-500 focus:border-white focus:ring-1 focus:ring-white outline-none transition-colors">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="organization" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Organization</label>
                            <input type="text" id="organization" name="organization" placeholder="Company Name Inc." 
                                   class="w-full px-4 py-3.5 rounded-xl border border-white/20 bg-zinc-900 text-white placeholder-zinc-500 focus:border-white focus:ring-1 focus:ring-white outline-none transition-colors">
                        </div>
                        <div>
                            <label for="service" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Service Interested In *</label>
                            <select id="service" name="service" required 
                                    class="w-full px-4 py-3.5 rounded-xl border border-white/20 bg-zinc-900 text-white focus:border-white focus:ring-1 focus:ring-white outline-none transition-colors">
                                <option value="" class="bg-black text-zinc-400">Select a service...</option>
                                <option value="Enterprise ERP & POS" class="bg-black text-white">Enterprise ERP & POS Systems</option>
                                <option value="Full-Stack Web & API" class="bg-black text-white">Full-Stack Web & API Engineering</option>
                                <option value="Cloud Infrastructure" class="bg-black text-white">Cloud Infrastructure & Migration</option>
                                <option value="IT Operations & Governance" class="bg-black text-white">IT Operations & Governance (ITIL/ITSM)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="message" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">Project Scope *</label>
                        <textarea id="message" name="message" rows="4" required placeholder="Describe your project goals, timelines, or key requirements..." 
                                  class="w-full px-4 py-3.5 rounded-xl border border-white/20 bg-zinc-900 text-white placeholder-zinc-500 focus:border-white focus:ring-1 focus:ring-white outline-none transition-colors resize-none"></textarea>
                    </div>

                    <div>
                        <button id="submit-btn" type="submit" class="w-full py-4 text-xs font-bold text-black bg-white hover:bg-zinc-200 rounded-full border border-white transition-all shadow-lg cursor-pointer flex items-center justify-center space-x-2 uppercase tracking-widest">
                            <svg id="btn-spinner" class="hidden w-4 h-4 text-black animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="btn-text">Submit Lead Inquiry &rarr;</span>
                        </button>
                    </div>

                    <!-- Async Inline Response Feedback Container -->
                    <div id="form-response" class="mt-4"></div>
                </form>
            </div>
        </div>
    </div>
</section>
