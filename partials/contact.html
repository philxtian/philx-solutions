<section id="contact" class="py-32 bg-transparent border-b border-black/10 dark:border-white/10 transition-colors duration-300">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="text-xs font-bold uppercase tracking-[0.3em] text-brand mb-4">Get In Touch</h2>
            <p class="text-3xl sm:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight">Initiate Consultation</p>
            <p class="mt-4 text-slate-600 dark:text-zinc-400 text-base max-w-xl mx-auto">Fill out your technical requirements or copy our direct engineering inbox below.</p>
            
            <!-- One-Click Copy Email Chip -->
            <div class="mt-6 inline-flex items-center justify-center">
                <button type="button" onclick="copyToClipboard('hello@philxsolutions.com', this)" 
                        class="inline-flex items-center space-x-2.5 px-5 py-2.5 rounded-full bg-slate-100 dark:bg-zinc-900 border border-black/10 dark:border-white/20 text-slate-800 dark:text-zinc-200 text-xs font-semibold hover:border-brand dark:hover:border-brand hover:text-brand transition-all cursor-pointer group shadow-sm">
                    <svg class="w-4 h-4 text-slate-500 group-hover:text-brand transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span class="copy-label">hello@philxsolutions.com</span>
                </button>
            </div>
        </div>

        <div class="aurora-wrapper group relative">
            <div class="aurora-glow absolute -inset-3 rounded-[2rem] bg-gradient-to-r from-brand via-blue-500 to-indigo-600 opacity-0 blur-2xl group-hover:opacity-30 transition-opacity duration-500 pointer-events-none -z-10"></div>
            <div class="aurora-border absolute -inset-[1px] rounded-2xl bg-gradient-to-r from-brand via-blue-500 to-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none -z-10"></div>

            <div class="bg-white dark:bg-black border border-black/10 dark:border-white/15 rounded-2xl p-8 sm:p-12 shadow-2xl shadow-black/5 dark:shadow-none relative z-10">
                <form id="contact-form" 
                      hx-post="api/contact-success.html" 
                      hx-target="#form-response" 
                      hx-swap="innerHTML"
                      onsubmit="window.PHILX_WP_API && window.PHILX_WP_API.handleContactSubmit(event)"
                      class="space-y-6">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-zinc-300 mb-2">Full Name *</label>
                            <input type="text" id="name" name="name" required placeholder="John Doe" 
                                   class="w-full px-4 py-3.5 rounded-xl border border-black/10 dark:border-white/20 bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:border-brand dark:focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-colors">
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-zinc-300 mb-2">Business Email *</label>
                            <input type="email" id="email" name="email" required placeholder="john@company.com" 
                                   class="w-full px-4 py-3.5 rounded-xl border border-black/10 dark:border-white/20 bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:border-brand dark:focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-colors">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="organization" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-zinc-300 mb-2">Organization</label>
                            <input type="text" id="organization" name="organization" placeholder="Company Name Inc." 
                                   class="w-full px-4 py-3.5 rounded-xl border border-black/10 dark:border-white/20 bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:border-brand dark:focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-colors">
                        </div>
                        <div>
                            <label for="service" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-zinc-300 mb-2">Service Interested In *</label>
                            <select id="service" name="service" required 
                                    class="w-full px-4 py-3.5 rounded-xl border border-black/10 dark:border-white/20 bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-white focus:border-brand dark:focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-colors">
                                <option value="" class="bg-white dark:bg-black text-slate-500 dark:text-zinc-400">Select a service...</option>
                                <option value="Website Design" class="bg-white dark:bg-black text-slate-900 dark:text-white">Website Design</option>
                                <option value="Web Development" class="bg-white dark:bg-black text-slate-900 dark:text-white">Web Development</option>
                                <option value="Mobile Applications" class="bg-white dark:bg-black text-slate-900 dark:text-white">Mobile Applications</option>
                                <option value="Enterprise & Cloud" class="bg-white dark:bg-black text-slate-900 dark:text-white">Enterprise Software & Microsoft 365</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="message" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-zinc-300 mb-2">Project Scope & Requirements *</label>
                        <textarea id="message" name="message" rows="4" required placeholder="Describe your project goals, timelines, or key requirements..." 
                                  class="w-full px-4 py-3.5 rounded-xl border border-black/10 dark:border-white/20 bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:border-brand dark:focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-colors resize-none"></textarea>
                    </div>

                    <div>
                        <button id="submit-btn" type="submit" class="w-full py-4 text-sm font-bold text-white bg-brand hover:bg-brand-600 rounded-full border border-brand transition-all shadow-lg shadow-brand/25 cursor-pointer flex items-center justify-center space-x-2">
                            <svg id="btn-spinner" class="hidden w-4 h-4 text-white animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="btn-text">Submit Lead Inquiry &rarr;</span>
                        </button>
                    </div>

                    <!-- HTMX / Async Inline Response Feedback Container -->
                    <div id="form-response" class="mt-4"></div>
                </form>
            </div>
        </div>
    </div>
</section>
